media:
  input: platform/site/assets/media
  output: /assets/media
  rename: safe

settings:
  commit:
    identity: user
    templates:
      update: "catalog: update literature table via Pages CMS"

content:
  - name: rl_literature
    label: MusicGen / RL / Reward catalog
    type: file
    path: platform/data/rl/literature.csv
    format: datagrid
    operations:
      delete: false
  - name: amt_literature
    label: Music Transcription (AMT) catalog
    type: file
    path: platform/data/amt/literature.csv
    format: datagrid
    operations:
      delete: false
