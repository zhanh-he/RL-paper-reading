  <g id="text_25">
   <text style="font-weight: 700; font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202a28" x="74.88" y="48.6" transform="rotate(-0 74.88 48.6)">Does SP richness transfer to learned music scores?</text>
  </g>
  <g id="text_26">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #56615b" x="74.88" y="82.944" transform="rotate(-0 74.88 82.944)">Same three SP-trained arms · raw SP and SongBench use different units</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #56615b" x="1094.4" y="48.6" transform="rotate(-0 1094.4 48.6)">C</text>
  </g>
  <g id="text_28">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #56615b" x="74.88" y="586.44" transform="rotate(-0 74.88 586.44)">N=30 paired conditions · 95% condition-bootstrap CI · 10,000 resamples · one training seed</text>
  </g>
  <g id="text_29">
   <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #56615b" x="74.88" y="605.88" transform="rotate(-0 74.88 605.88)">Different model budgets / adapters / beta: within-arm effects only, not a causal comparison of model quality.</text>
  </g>
  <g id="text_30">
