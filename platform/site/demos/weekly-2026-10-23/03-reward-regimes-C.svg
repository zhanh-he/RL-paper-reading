   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #56615b" x="74.88" y="82.944" transform="rotate(-0 74.88 82.944)">All eight verified arms · same fixed 30-condition validation membership</text>
  </g>
  <g id="text_26">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #56615b" x="1094.4" y="48.6" transform="rotate(-0 1094.4 48.6)">C</text>
  </g>
  <g id="text_27">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #56615b" x="74.88" y="586.44" transform="rotate(-0 74.88 586.44)">N=30 paired conditions · 95% condition-bootstrap CI · 10,000 resamples · one training seed</text>
  </g>
  <g id="text_28">
   <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #56615b" x="74.88" y="605.88" transform="rotate(-0 74.88 605.88)">SP / single-head targets include guard; Mean7 is unguarded. Mean7 is not a human MOS or independent judge.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #56615b" x="74.88" y="624.672" transform="rotate(-0 74.88 624.672)">Validation, not full-song test or human preference. Unadjusted intervals; no across-model causal ranking.</text>
  </g>
 </g>
